name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pytest (${{ matrix.compiler }})
    runs-on: [self-hosted, unbound]

    strategy:
      matrix:
        include:
          - compiler: gcc
          - compiler: llvm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install Clang
        if: matrix.compiler == 'llvm'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld

      - name: Run pytest with clang
        if: matrix.compiler == 'llvm'
        env:
          USE_CLANG: '1'
        run: PATH="$(llvm-config --prefix)/bin:$PATH" pytest

      - name: Run pytest without clang
        if: matrix.compiler != 'llvm'
        run: pytest
