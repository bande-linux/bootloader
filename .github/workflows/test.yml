name: test

on:
  push:
    tags: ['v*']

jobs:
  test:
    name: Pytest (${{ matrix.compiler }})
    runs-on: [self-hosted, unbound]

    strategy:
      matrix:
        include:
          - compiler: gcc
          - compiler: llvm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt pytest
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install Clang
        if: matrix.compiler == 'llvm'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld

      - name: Run pytest with clang
        if: matrix.compiler == 'llvm'
        env:
          USE_CLANG: '1'
        run: PATH="$(llvm-config --prefix)/bin:$PATH" pytest

      - name: Run pytest without clang
        if: matrix.compiler != 'llvm'
        run: pytest
