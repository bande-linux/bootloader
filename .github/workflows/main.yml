# This is a basic workflow to help you get started with Actions

name: format-check

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  format-check:
    runs-on: [self-hosted, unbound]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: install nightly rust
        run: |
          rm -f ~/.cargo/bin/rustfmt
          rm -f ~/.cargo/bin/cargo-fmt
          rustup toolchain install nightly --component rustfmt --component clippy --allow-downgrade

      - name: Run format-check
        run: |
          . "$HOME/.cargo/env"
          make format CLANG_FORMAT=clang-format-20
          git diff
          git reset --hard
          make format-check CLANG_FORMAT=clang-format-20
          make rustfmt-check
