# This is a basic workflow to help you get started with Actions

name: format-check

# Controls when the action will run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-24.04-arm

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install clang-format 20
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-20

      - name: install nightly rust
        run: |
          rustup toolchain install nightly --component rustfmt --component clippy --allow-downgrade

      - name: Run format-check
        run: |
          . "$HOME/.cargo/env"
          make format CLANG_FORMAT=clang-format-20
          git diff
          git reset --hard
          make format-check CLANG_FORMAT=clang-format-20
          make rustfmt-check
